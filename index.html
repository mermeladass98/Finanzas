<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

* { box-sizing: border-box; }

/* Hero */
.f-hero { background: linear-gradient(160deg, #10503C 0%, #0B3B2C 55%, #072A20 100%); color: #EAF4EE; border-radius: 16px; padding: 20px; box-shadow: 0 8px 24px rgba(11,59,44,0.25); position: relative; overflow: hidden; }

.f-pct-chip { background: rgba(255,255,255,0.12); color: #EAF4EE; border-radius: 999px; padding: 2px 8px; font-size: 0.72rem; display: inline-flex; align-items: center; gap: 4px; }

.f-input-oscuro { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.25); border-radius: 8px; padding: 2px 6px; color: #EAF4EE; width: 56px; text-align: center; font-size: 0.85rem; }

/* Tarjetas */

.f-navbtn { color: #4A6357; padding: 6px; border-radius: 8px; display: inline-flex; }
.f-navbtn:hover { background: #E4EBE5; }
.f-navbtn:focus-visible { outline: 2px solid #0B3B2C; }
.f-nav-on { background: #E4EBE5; }
.f-link { color: #0B3B2C; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; font-size: 0.85rem; }
.f-despl { width: 100%; text-align: left; }

/* Barras */

.f-barra { background: #0B3B2C; border-radius: 999px; height: 8px; }
.barras6 { display: flex; align-items: flex-end; gap: 8px; height: 96px; }
.barras6 > div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
.barra-v { width: 100%; border-radius: 4px 4px 0 0; }

/* Filas de listas */

.f-alerta { background: #FBEAE5; border: 1px solid #E8B4A5; color: #7A2E1D; border-radius: 10px; padding: 8px 12px; font-size: 0.85rem; margin-bottom: 12px; }

.f-rojo { color: #B0442F; }

.f-card-rojo .f-titulo-card { color: #B0442F; }

.f-aviso-copia { background: #FDF3E7; border-color: #EAD9B8; }

/* ── Modo oscuro ── */
body.oscuro { background: #0D1411; color: #E4EDE7; }

.oscuro .f-tab { color: #8FA79A; }
.oscuro .f-tab-activo { background: #45E6A0; color: #0B3B2C; }

.oscuro .f-card-rojo { border-color: #52322B; }
.oscuro .f-card-rojo .f-titulo-card, .oscuro .f-rojo { color: #F2A28E; }
.oscuro .f-input { background: #0D1411; border-color: #2E3C34; color: #E4EDE7; }
.oscuro .f-subform { background: #101813; border-color: #243029; }
.oscuro .f-chip, .oscuro .f-chip-mini { background: #1B2620; border-color: #2E3C34; color: #C4D4CA; }
.oscuro .f-chip-activo { background: #45E6A0; border-color: #45E6A0; color: #0B3B2C; }
.oscuro .f-btn-primario { background: #45E6A0; color: #0B3B2C; }
.oscuro .f-btn-secundario { background: transparent; border-color: #45E6A0; color: #45E6A0; }
.oscuro .f-btn-deshabilitado { background: #243029; color: #5E7268; }
.oscuro .f-navbtn { color: #8FA79A; }
.oscuro .f-navbtn:hover { background: #1B2620; }
.oscuro .f-nav-on { background: #1B2620; }
.oscuro .f-eyebrow, .oscuro .f-label, .oscuro .f-suave { color: #8FA79A; }
.oscuro .f-verde, .oscuro .f-link { color: #45E6A0; }
.oscuro .f-barra-fondo { background: #243029; }
.oscuro .f-barra { background: #45E6A0; }
.oscuro .mov { border-top-color: #243029; }
.oscuro .f-divisor > * + * { border-color: #243029; }
.oscuro .f-sep { border-top-color: #243029; }
.oscuro .f-item-destacado { background: #2C2413; }
.oscuro .f-aviso-copia { background: #2C2413; border-color: #4A3B1C; }
.oscuro .f-alerta { background: #33170F; border-color: #5E2E20; color: #F2A28E; }
.oscuro .f-hero { box-shadow: none; border: 1px solid #1E3A2E; }

details.backup { margin-top: 24px; }
details.backup summary { color: #7C8F84; font-size: 0.75rem; text-align: center; cursor: pointer; list-style: none; }
details.backup summary::-webkit-details-marker { display: none; }

svg { display: block; }

@media (prefers-reduced-motion: reduce) {
  .f-btn-primario:active, .f-btn-secundario:active { transform: none; }
}
</style>

<body>
<div id="app"></div>

<script>
// ── Configuración ───────────────────────────────────────────────────
const STORAGE_KEY = "finanzas:v1";
const CATS_GASTO = ["Alimentación", "Transporte", "Ocio", "Salud", "Deporte", "Niños", "Compras", "Regalos", "Otros"];
const CATS_INGRESO = ["Nómina extra", "Venta", "Devolución", "Otros"];
const EMO = { "Alimentación": "🛒", "Transporte": "⛽", "Ocio": "🎉", "Salud": "💊", "Deporte": "🏓", "Niños": "🧒", "Compras": "🛍️", "Regalos": "🎁", "Otros": "📦", "Nómina": "💼", "Paro": "🏛️", "Nómina extra": "💶", "Venta": "🏷️", "Devolución": "↩️" };
const emo = (c) => (EMO[c] ? EMO[c] + " " : "");
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const MC = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const PERIODOS = [{ v: 3, label: "Trimestral" }, { v: 6, label: "Semestral" }, { v: 12, label: "Anual" }];

// Parámetros fiscales aproximados (tramos 2025)
const TRAMOS_ESTATAL = [[12450, 0.095], [20200, 0.12], [35200, 0.15], [60000, 0.185], [300000, 0.225], [Infinity, 0.245]];
const TRAMOS_CAT = [[12450, 0.105], [17707.2, 0.12], [21000, 0.14], [33007.2, 0.15], [53407.2, 0.188], [90000, 0.215], [120000, 0.235], [175000, 0.245], [Infinity, 0.255]];
const MIN_PERSONAL = 5550, MIN_PERSONAL_CAT_BAJO = 6105, MIN_DESC = [2400, 2700, 4000, 4500], MIN_MENOR3 = 2800;
const SS_EST = 0.065; // estimación cotización trabajador si no se indica
const SS_EST_PARO = 0.047; // estimación cotización descontada en la prestación de paro

const DEFAULT_DATA = {
  transactions: [], config: { objetivoPct: 20, objetivoModo: "excedente", objetivoPctExc: 50, saldoAhorro: null, tema: "claro", ultimaCopia: null, nombre: null, renta: { hijos: 0, hijosMenores3: 0, compartidos: true, planPensiones: 0, ccaa: "cat" } },
  ingresosFijos: [], gastosFijos: [], deudas: [], inversiones: [], anuales: [], metas: [],
};

// ── Almacenamiento: window.storage (Claude) o localStorage (navegador) ──
const store = {
  async get(k) {
    if (window.storage && window.storage.get) {
      try { const r = await window.storage.get(k); return r ? r.value : null; } catch (e) { return null; }
    }
    try { return localStorage.getItem(k); } catch (e) { return null; }
  },
  async set(k, v) {
    if (window.storage && window.storage.set) {
      try { const r = await window.storage.set(k, v); return !!r; } catch (e) { return false; }
    }
    try { localStorage.setItem(k, v); return true; } catch (e) { return false; }
  },
};

// ── Utilidades ──────────────────────────────────────────────────────
const eur = new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR" });
const fmtEur = (n) => eur.format(n);
const parseNum = (v) => {
  let s = String(v).trim();
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
};
const parseSuma = (v) => String(v).split("+").reduce((s, p) => s + parseNum(p), 0);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now() + "-" + Math.random().toString(36).slice(2, 7);
const hoyISO = () => {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
};
const claveMes = (y, m) => y + "-" + String(m + 1).padStart(2, "0");

// Iconos SVG
const I = (d, s) => '<svg viewBox="0 0 24 24" width="' + (s||18) + '" height="' + (s||18) + '" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';
const IC = {
  izq: I('<path d="M15 18l-6-6 6-6"/>', 20),
  der: I('<path d="M9 18l6-6-6-6"/>', 20),
  mas: I('<path d="M12 5v14M5 12h14"/>'),
  x: I('<path d="M18 6L6 18M6 6l12 12"/>'),
  ok: I('<path d="M20 6L9 17l-4-4"/>', 16),
  okMini: I('<path d="M20 6L9 17l-4-4"/>', 14),
  papelera: I('<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/>', 15),
  lapiz: I('<path d="M17 3l4 4L7 21H3v-4L17 3"/>', 15),
  lapizMini: I('<path d="M17 3l4 4L7 21H3v-4L17 3"/>', 11),
  descarga: I('<path d="M21 15v4H3v-4M12 3v12M7 10l5 5 5-5"/>', 14),
  abajo: I('<path d="M6 9l6 6 6-6"/>', 18),
  arriba: I('<path d="M18 15l-6-6-6 6"/>', 18),
};

// ── Estado ──────────────────────────────────────────────────────────
let data = JSON.parse(JSON.stringify(DEFAULT_DATA));
let ui = {
  cargando: true, errorGuardado: false,
  tab: "resumen",
  y: new Date().getFullYear(), m: new Date().getMonth(),
  formTipo: null, formCat: "", nominaTipo: "nomina",
  borrandoMov: null,
  editor: null,        // { sec, id|null }
  borrandoItem: null,  // { sec, id }
  editandoPct: false,
  rentaAño: null,
  movAbierto: false,
  confirmReset: false,
  editandoSaldo: false,
  splash: true,
  subMes: "dia",
  invAdd: false,
  invBorrando: null,
};

async function persist() {
  try {
    const ok = await store.set(STORAGE_KEY, JSON.stringify(data));
    if (!ok && !ui.errorGuardado) { ui.errorGuardado = true; render(); }
    if (ok && ui.errorGuardado) { ui.errorGuardado = false; render(); }
  } catch (e) {
    if (!ui.errorGuardado) { ui.errorGuardado = true; render(); }
  }
}

// ── Cálculos ────────────────────────────────────────────────────────
function calc(anio, mes) {
  const Y = anio == null ? ui.y : anio;
  const M = mes == null ? ui.m : mes;
  const totIngFijos = data.ingresosFijos.reduce((s, i) => s + i.importe, 0);
  const totGastFijos = data.gastosFijos.reduce((s, i) => s + i.importe, 0);
  const totCuotas = data.deudas.reduce((s, i) => s + i.cuota, 0);
  const totInversiones = data.inversiones.reduce((s, i) => s + i.importe, 0);
  const totProvision = data.anuales.reduce((s, i) => s + i.importe / (i.periodo || 12), 0);
  const comprometido = totGastFijos + totCuotas + totProvision;
  const totPendiente = data.deudas.reduce((s, i) => s + (i.pendiente || 0), 0);

  const pref = claveMes(Y, M);
  const txMes = data.transactions.filter((t) => t.date && t.date.startsWith(pref)).sort((a, b) => b.date.localeCompare(a.date));
  const varIng = txMes.filter((t) => t.type === "ingreso").reduce((s, t) => s + t.amount, 0);
  const varGas = txMes.filter((t) => t.type === "gasto").reduce((s, t) => s + t.amount, 0);

  const ingresosMes = totIngFijos + varIng;
  const excedente = ingresosMes - comprometido;
  const ahorro = ingresosMes - comprometido - varGas;
  const modo = data.config.objetivoModo || "ingresos";
  const pctActivo = modo === "excedente" ? (data.config.objetivoPctExc != null ? data.config.objetivoPctExc : 50) : data.config.objetivoPct;
  const objetivo = modo === "excedente" ? (Math.max(excedente, 0) * pctActivo) / 100 : (ingresosMes * pctActivo) / 100;
  const progresoObj = objetivo > 0 ? (ahorro / objetivo) * 100 : null;
  const margen = ingresosMes - comprometido - objetivo - varGas;
  const ahorroLibre = ahorro - totInversiones;

  const mapa = {};
  txMes.filter((t) => t.type === "gasto").forEach((t) => { mapa[t.category] = (mapa[t.category] || 0) + t.amount; });
  const porCategoria = Object.entries(mapa).sort((a, b) => b[1] - a[1]);
  const maxCat = porCategoria.length ? porCategoria[0][1] : 0;

  const tendencia = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(Y, M - i, 1);
    const k = claveMes(d.getFullYear(), d.getMonth());
    const del = data.transactions.filter((t) => t.date && t.date.startsWith(k));
    const vi = del.filter((t) => t.type === "ingreso").reduce((s, t) => s + t.amount, 0);
    const vg = del.filter((t) => t.type === "gasto").reduce((s, t) => s + t.amount, 0);
    tendencia.push({ label: MC[d.getMonth()], valor: totIngFijos + vi - comprometido - vg, actual: i === 0 });
  }
  const maxTend = Math.max(...tendencia.map((t) => Math.abs(t.valor)), 1);

  // Gasto variable típico: media de los últimos 3 meses con actividad (sin contar el visible)
  let sumV = 0, nV = 0;
  for (let i = 1; i <= 3; i++) {
    const d = new Date(Y, M - i, 1);
    const k = claveMes(d.getFullYear(), d.getMonth());
    const del = data.transactions.filter((t) => t.date && t.date.startsWith(k));
    if (del.length) { sumV += del.filter((t) => t.type === "gasto").reduce((s, t) => s + t.amount, 0); nV++; }
  }
  const mediaVar = nV ? sumV / nV : null;
  const ahorroPosible = mediaVar != null && ingresosMes > 0 ? excedente - mediaVar : null;

  const huchaTotal = data.anuales.reduce((s, i) => s + infoAnual(i).necesaria, 0);

  return { totIngFijos, totGastFijos, totCuotas, totInversiones, totProvision, comprometido, totPendiente,
    txMes, varIng, varGas, ingresosMes, excedente, ahorro, modo, pctActivo, objetivo, progresoObj, margen, ahorroLibre,
    mediaVar, ahorroPosible, porCategoria, maxCat, tendencia, maxTend, huchaTotal };
}

function infoAnual(item) {
  const mA = new Date().getMonth();
  const P = item.periodo || 12;
  const hasta = (((item.mesPago - mA) % P) + P) % P;
  const desde = (((mA - item.mesPago) % P) + P) % P;
  const necesaria = desde === 0 ? item.importe : (item.importe * desde) / P;
  const proxMes = (mA + hasta) % 12;
  return { hasta, desde, necesaria, provision: item.importe / P, proxMes, P };
}

// ── Pestaña Renta (estimación IRPF) ──
function cuotaEscala(tramos, base) {
  let c = 0, prev = 0;
  for (const [lim, t] of tramos) {
    const tramo = Math.min(base, lim) - prev;
    if (tramo > 0) c += tramo * t;
    if (base <= lim) break;
    prev = lim;
  }
  return c;
}

function calcRenta(anyo) {
  const cfg = data.config.renta || DEFAULT_DATA.config.renta;
  const noms = data.transactions
    .filter((t) => t.bruto != null && t.date && t.date.startsWith(anyo))
    .sort((a, b) => a.date.localeCompare(b.date));
  const bruto = noms.reduce((s, t) => s + t.bruto, 0);
  const irpf = noms.reduce((s, t) => s + (t.irpf || 0), 0);
  const ss = noms.reduce((s, t) => s + (t.ss != null ? t.ss : t.bruto * (t.category === "Paro" ? SS_EST_PARO : SS_EST)), 0);
  const ssEstimadas = noms.some((t) => t.ss == null);
  const sindical = noms.reduce((s, t) => s + (t.sindical || 0), 0);

  const rnt = Math.max(bruto - ss - sindical - 2000, 0); // rendimiento neto del trabajo
  let red = 0; // reducción por rendimientos del trabajo (2025)
  if (rnt <= 14852) red = 7302;
  else if (rnt <= 17673.52) red = 7302 - 1.75 * (rnt - 14852);
  else if (rnt < 19747.5) red = 2364.34 - 1.14 * (rnt - 17673.52);
  red = Math.max(Math.min(red, rnt), 0);

  const plan = Math.min(cfg.planPensiones || 0, 1500);
  const base = Math.max(rnt - red - plan, 0);

  let minDesc = 0;
  for (let i = 0; i < (cfg.hijos || 0); i++) minDesc += MIN_DESC[Math.min(i, 3)];
  minDesc += (cfg.hijosMenores3 || 0) * MIN_MENOR3;
  if (cfg.compartidos !== false) minDesc /= 2;

  const esCat = (cfg.ccaa || "cat") === "cat";
  const tramosAut = esCat ? TRAMOS_CAT : TRAMOS_ESTATAL;
  const minEstatal = MIN_PERSONAL + minDesc;
  const minAut = (esCat && base <= 12450 ? MIN_PERSONAL_CAT_BAJO : MIN_PERSONAL) + minDesc;

  const cuotaEst = Math.max(cuotaEscala(TRAMOS_ESTATAL, base) - cuotaEscala(TRAMOS_ESTATAL, Math.min(minEstatal, base)), 0);
  const cuotaAut = Math.max(cuotaEscala(tramosAut, base) - cuotaEscala(tramosAut, Math.min(minAut, base)), 0);
  const cuota = cuotaEst + cuotaAut;
  const resultado = cuota - irpf; // + a pagar · − a devolver
  const tipoMedio = bruto > 0 ? (cuota / bruto) * 100 : 0;
  return { noms, bruto, irpf, ss, ssEstimadas, sindical, rnt, red, plan, base, minimo: minEstatal, cuotaEst, cuotaAut, esCat, cuota, resultado, tipoMedio };
}

function fvInversion(inicial, mensual, pct, anios) {
  const m = Math.max(Math.round(anios * 12), 1);
  const rm = pct / 100 / 12;
  const fv = rm === 0 ? inicial + mensual * m : inicial * Math.pow(1 + rm, m) + mensual * ((Math.pow(1 + rm, m) - 1) / rm);
  return { fv, aportado: inicial + mensual * m };
}

function leerCarteras() {
  return invCfg().carteras.map((c, idx) => ({
    id: c.id, nombre: c.nombre,
    inicial: parseNum(document.getElementById("c" + idx + "Ini").value),
    mensual: parseNum(document.getElementById("c" + idx + "Men").value),
    pct: parseNum(document.getElementById("c" + idx + "Pct").value),
    pareja: document.getElementById("c" + idx + "Par").checked,
  }));
}
function recalcInv() {
  const anios = Math.max(parseNum(document.getElementById("iAnios").value), 1);
  const cs = leerCarteras();
  let total = 0, tuParte = 0, tuAportado = 0, algunaPareja = false, lineas = "";
  cs.forEach((c, idx) => {
    const r = fvInversion(c.inicial, c.mensual, c.pct, anios);
    total += r.fv;
    tuParte += c.pareja ? r.fv / 2 : r.fv;
    tuAportado += c.pareja ? r.aportado / 2 : r.aportado;
    if (c.pareja) algunaPareja = true;
    document.getElementById("c" + idx + "Res").textContent = fmtEur(r.fv) + " (+" + fmtEur(Math.max(r.fv - r.aportado, 0)) + ")" + (c.pareja ? " · tuya: " + fmtEur(r.fv / 2) : "");
    lineas += '<div class="f-linea"><span class="f-eyebrow-claro">' + esc(c.nombre) + (c.pareja ? " 👥" : "") + '</span><span class="f-mono">' + fmtEur(r.fv) + "</span></div>";
  });
  document.getElementById("rFuturo").textContent = fmtEur(total);
  document.getElementById("rSub").textContent = "en " + anios + " años · valor total de los fondos";
  lineas += '<div class="f-linea"><span class="f-eyebrow-claro">Tu bolsillo habrá puesto</span><span class="f-mono">' + fmtEur(tuAportado) + "</span></div>";
  if (algunaPareja) lineas += '<div class="f-linea"><span class="f-eyebrow-claro">👥 Tu parte del total</span><span class="f-mono f-mint">' + fmtEur(tuParte) + "</span></div>";
  lineas += '<div class="f-linea"><span class="f-eyebrow-claro">Ganancia' + (algunaPareja ? " (tu parte)" : "") + '</span><span class="f-mono f-mint">+' + fmtEur(Math.max(tuParte - tuAportado, 0)) + "</span></div>";
  document.getElementById("rDesglose").innerHTML = lineas;
  document.getElementById("invHitos").innerHTML = [5, 10, 15, 20, 25].map((a) => {
    const t = cs.reduce((s, c) => s + fvInversion(c.inicial, c.mensual, c.pct, a).fv, 0);
    return '<div class="fila entre sm" style="margin-top:4px"><span class="f-suave">En ' + a + ' años</span><span class="f-mono negrita">' + fmtEur(t) + "</span></div>";
  }).join("");
}
function guardarInv() {
  data.config.inversion = {
    anios: Math.max(parseNum(document.getElementById("iAnios").value), 1),
    carteras: leerCarteras(),
  };
  persist();
}
function addFondo(i) {
  const p = PRESETS_FONDOS[i];
  invCfg().carteras.push({ id: uid(), nombre: p.nombre, pct: p.pct, inicial: 0, mensual: 0, pareja: false });
  ui.invAdd = false;
  persist(); render();
}
function borrarFondo(id) {
  const v = invCfg();
  v.carteras = v.carteras.filter((c) => c.id !== id);
  data.config.inversion = v;
  ui.invBorrando = null;
  persist(); render();
}

  const imp = parseNum(document.getElementById("mImporte").value);

    '<button class="f-chip' + (esParo ? " f-chip-activo" : "") + '" onclick="setNominaTipo(\'paro\')">Paro (SEPE)</button></div>' +
    '<div class="grid2 mb3">' +
    '<div><label class="f-label">Bruto €</label><input id="nBruto" class="f-input f-mono" type="text" inputmode="decimal" placeholder="0,00" oninput="recalcNeto()" autofocus></div>' +
    '<div><label class="f-label">IRPF %</label><input id="nIrpf" class="f-input f-mono" type="text" inputmode="decimal" placeholder="' + (esParo ? "0" : "2,00") + '" value="' + String(irpfDef).replace(".", ",") + '" oninput="recalcNeto()"><p class="f-suave peq mt1 f-mono" id="nIrpfEur"></p></div>' +
    '<div><label class="f-label">' + (esParo ? "Cotización descontada €" : "Seg. Social €") + ' <span style="text-transform:none">(suma con +)</span></label><input id="nSS" class="f-input f-mono" type="text" placeholder="' + (esParo ? "0,00" : "87,73+28,04+1,81") + '" oninput="recalcNeto()"><p class="f-suave peq mt1 f-mono" id="nSSEur"></p></div>' +
    (esParo ? "" : '<div><label class="f-label">Cuota sindical €</label><input id="nSindical" class="f-input f-mono" type="text" inputmode="decimal" value="' + String(sindDef).replace(".", ",") + '" oninput="recalcNeto()"></div>') +
    '<div><label class="f-label">Neto €</label><input id="nNeto" class="f-input f-mono" type="text" inputmode="decimal" placeholder="0,00"></div>' +
    '<div><label class="f-label">Fecha</label><input id="nFecha" class="f-input" type="date" value="' + hoyISO() + '"></div>' +
    '<div class="span2"><label class="f-label">Nota (opcional)</label><input id="nNota" class="f-input" type="text" placeholder="' + (esParo ? "Prestación marzo…" : "Paga extra…") + '"></div>' +
    "</div>" +
    '<button class="f-btn f-btn-primario" onclick="guardarNomina()">' + IC.ok + " Guardar " + (esParo ? "paro" : "nómina") + "</button>" +
    '<p class="f-suave peq mt3">' + (esParo
      ? "El paro tributa como rendimiento del trabajo, igual que la nómina, y se suma al cálculo de la pestaña Renta. El SEPE suele retener un 0% de IRPF: por eso con dos pagadores la renta acostumbra a salir a pagar. La cotización que te descuentan es deducible (vacía = estimación del 4,7%)."
      : "IRPF en %, tal como sale en tu nómina: el importe en € se calcula solo. En Seg. Social puedes escribir la suma de contingencias comunes + desempleo/atur + formación (ej. 87,73+28,04+1,81); si la dejas vacía se estima un 6,5% del bruto, que se desvía unos euros en meses con paga extra. Bruto, IRPF, SS y sindical alimentan la pestaña Renta.") + "</p></section>";
}
function recalcNeto() {
  const b = parseNum(document.getElementById("nBruto").value);
  const pct = parseNum(document.getElementById("nIrpf").value);
  const irpfEur = Math.round(b * pct) / 100;
  const sRaw = document.getElementById("nSS").value.trim();
  const tasaEst = ui.nominaTipo === "paro" ? SS_EST_PARO : SS_EST;
  const s = sRaw ? Math.round(parseSuma(sRaw) * 100) / 100 : Math.round(b * tasaEst * 100) / 100;
  const sindEl = document.getElementById("nSindical");
  const sind = sindEl ? parseNum(sindEl.value) : 0;
  document.getElementById("nIrpfEur").textContent = b > 0 ? "= " + fmtEur(irpfEur) : "";
  document.getElementById("nSSEur").textContent = sRaw ? "= " + fmtEur(s) : (b > 0 ? "estimada: " + fmtEur(s) : "");
  const neto = Math.max(b - irpfEur - s - sind, 0);
  document.getElementById("nNeto").value = neto ? String(Math.round(neto * 100) / 100).replace(".", ",") : "";
}
function guardarNomina() {
  const bruto = parseNum(document.getElementById("nBruto").value);
  const irpfPct = parseNum(document.getElementById("nIrpf").value);
  const irpf = Math.round(bruto * irpfPct) / 100;
  const ssRaw = document.getElementById("nSS").value.trim();
  const neto = parseNum(document.getElementById("nNeto").value);
  const fecha = document.getElementById("nFecha").value;
  const nota = document.getElementById("nNota").value.trim();
  if (bruto <= 0) { document.getElementById("nBruto").classList.add("f-input-error"); return; }
  if (neto <= 0) { document.getElementById("nNeto").classList.add("f-input-error"); return; }
  if (!fecha) return;
  const sindEl = document.getElementById("nSindical");
  data.transactions.push({
    id: uid(), type: "ingreso", amount: Math.round(neto * 100) / 100,
    category: ui.nominaTipo === "paro" ? "Paro" : "Nómina",
    date: fecha, note: nota,
    bruto: Math.round(bruto * 100) / 100, irpf: irpf, irpfPct: Math.round(irpfPct * 100) / 100,
    ss: ssRaw ? Math.round(parseSuma(ssRaw) * 100) / 100 : null,
    sindical: sindEl ? Math.round(parseNum(sindEl.value) * 100) / 100 : 0,
  });
  persist();
  ui.formTipo = null;
  const [y, m] = fecha.split("-").map(Number);
  ui.y = y; ui.m = m - 1;
  render();
}

function borrarMov(id) { data.transactions = data.transactions.filter((t) => t.id !== id); ui.borrandoMov = null; persist(); render(); }

function editarPct() { ui.editandoPct = true; render(); const el = document.getElementById("pctInput"); if (el) { el.focus(); el.select(); } }
function guardarPct() {
  const p = Math.max(0, Math.min(100, parseNum(document.getElementById("pctInput").value)));
  if ((data.config.objetivoModo || "ingresos") === "excedente") data.config.objetivoPctExc = p;
  else data.config.objetivoPct = p;
  ui.editandoPct = false; persist(); render();
}
function editarSaldo() {
  ui.editandoSaldo = true;
  render();
  const e = document.getElementById("saldoInput");
  if (e) { e.focus(); e.select(); }
}
function guardarSaldo() {
  const v = parseNum(document.getElementById("saldoInput").value);
  data.config.saldoAhorro = { importe: Math.round(v * 100) / 100, fecha: hoyISO() };
  ui.editandoSaldo = false;
  persist(); render();
}
function setModoObjetivo(m) {
  data.config.objetivoModo = m;
  if (m === "excedente" && data.config.objetivoPctExc == null) data.config.objetivoPctExc = 50;
  ui.editandoPct = false;
  persist(); render();
}

function abrirEditor(sec, id) { ui.editor = { sec, id: id || null }; ui.borrandoItem = null; render(); }
function guardarItem(sec) {
  const cfg = SECCIONES[sec];
  const obj = { id: ui.editor.id || uid() };
  for (const c of cfg.campos) {
    const el = document.getElementById("f_" + c.key);
    obj[c.key] = c.tipo === "importe" ? Math.round(parseNum(el.value) * 100) / 100
      : c.tipo === "mes" || c.tipo === "periodo" ? Number(el.value)
      : c.tipo === "numero" ? parseNum(el.value)
      : c.tipo === "check" ? el.checked
      : String(el.value).trim();
  }
  if (!obj[cfg.campos[0].key]) { document.getElementById("f_" + cfg.campos[0].key).classList.add("f-input-error"); return; }
  if (!cfg.ceroOk && obj[cfg.importeKey] <= 0) { document.getElementById("f_" + cfg.importeKey).classList.add("f-input-error"); return; }
  data[sec] = ui.editor.id ? data[sec].map((i) => (i.id === ui.editor.id ? obj : i)) : [...data[sec], obj];
  ui.editor = null; persist(); render();
}
function borrarItem(sec, id) { data[sec] = data[sec].filter((i) => i.id !== id); ui.borrandoItem = null; persist(); render(); }

function exportarCSV() {
  const filas = [["fecha", "tipo", "categoria", "importe", "nota"]];
  [...data.transactions].sort((a, b) => a.date.localeCompare(b.date)).forEach((t) => {
    filas.push([t.date, t.type, t.category, String(t.amount).replace(".", ","), (t.note || "").replace(/;/g, ",")]);
  });
  descargar(filas.map((f) => f.join(";")).join("\n"), "movimientos.csv", "text/csv;charset=utf-8", "\ufeff");
}
function diasCopia() {
  if (!data.config.ultimaCopia) return null;
  return Math.floor((Date.now() - new Date(data.config.ultimaCopia + "T00:00:00").getTime()) / 86400000);
}
function exportarJSON() {
  descargar(JSON.stringify(data, null, 2), "finanzas-backup.json", "application/json");
  data.config.ultimaCopia = hoyISO();
  persist(); render();
}
function descargar(contenido, nombre, tipo, bom) {
  const blob = new Blob([(bom || "") + contenido], { type: tipo });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nombre; a.click();
  URL.revokeObjectURL(url);
}
function importarJSON(inp) {
  const f = inp.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const p = JSON.parse(r.result);
      if (!p || typeof p !== "object" || !Array.isArray(p.transactions)) throw new Error("formato");
      data = { ...JSON.parse(JSON.stringify(DEFAULT_DATA)), ...p, config: { ...DEFAULT_DATA.config, ...(p.config || {}) } };
      ["transactions", "ingresosFijos", "gastosFijos", "deudas", "inversiones", "anuales", "metas"].forEach((k) => { if (!Array.isArray(data[k])) data[k] = []; });
      data.config.ultimaCopia = hoyISO();
      persist(); render();
    } catch (e) {
      ui.errorGuardado = false;
      alert("El archivo no es una copia válida de esta app.");
    }
  };
  r.readAsText(f);
  inp.value = "";
}

// ── Inicio ──────────────────────────────────────────────────────────
(async function init() {
  try {
    const v = await store.get(STORAGE_KEY);
    if (v) {
      const p = JSON.parse(v);
      data = { ...JSON.parse(JSON.stringify(DEFAULT_DATA)), ...p, config: { ...DEFAULT_DATA.config, ...(p.config || {}) } };
      ["transactions", "ingresosFijos", "gastosFijos", "deudas", "inversiones", "anuales", "metas"].forEach((k) => { if (!Array.isArray(data[k])) data[k] = []; });
    }
  } catch (e) { /* primera vez */ }
  ui.cargando = false;
  render();
})();
</script>

if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
